server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# Same-origin API: keeps the /api prefix, so the backend routes stay /api/*.
	location /api/ {
		proxy_pass http://api:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Cache immutable hashed assets from the SvelteKit build.
	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# SPA fallback: adapter-static ships index.html as the fallback page.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# The SPA shell must never be cached, otherwise a deploy keeps serving old assets.
	location = /index.html {
		add_header Cache-Control "no-cache";
	}
}
