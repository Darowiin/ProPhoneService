# ── pro телефон: конфиг nginx для стенда (спринт 3, карточки 8 + рейт-лимиты) ──
# Ставится НАТИВНО на VM (фронт не контейнеризуется). Рядом с раздачей статики
# здесь работают рейт-лимиты по IP: защита перебора кодов и спама API.
#
# Установка (кратко, полная — в README спринта 3):
#   sudo apt install nginx
#   sudo cp nginx-prophone.conf /etc/nginx/sites-available/prophone
#   sudo ln -s /etc/nginx/sites-available/prophone /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Сборка фронта: cd client && VITE_API_URL=/api npm run build
#   → содержимое build/ в /var/www/prophone/client/build

# Зоны лимитов считаются по IP клиента (binary-addr компактнее в памяти).
# rate = средний темп, burst = разрешённый залп, nodelay = залп сразу.
limit_req_zone $binary_remote_addr zone=auth_codes:10m   rate=10r/m;   # request-code / confirm
limit_req_zone $binary_remote_addr zone=api_general:10m  rate=60r/m;   # остальное API
limit_req_zone $binary_remote_addr zone=api_heavy:10m    rate=6r/m;    # создание заявок и VK-ссылок

server {
	listen 80 default_server;
	server_name _;

	# Корень — собранная статика SvelteKit (adapter-static).
	root /var/www/prophone/client/build;
	index index.html;

	# Файлы заявок/кодов маленькие; страхуемся на будущее (фото — спринт 4).
	client_max_body_size 2m;

	# SPA-фолбэк: все маршруты интерфейса ведут на index.html.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# ── Рейт-лимиты API ────────────────────────────────────────────────────
	# Бек сам считает по своему RemoteIpAddress — это IP nginx, поэтому его
	# лимиты "на клиента" через nginx не работают; реальная защита — здесь.
	# Чтобы бек видел настоящего клиента и его лимиты заработали честно,
	# Влад должен включить ForwardedHeaders (см. замечание в PR).

	location = /api/auth/request-code {
		limit_req zone=auth_codes burst=4 nodelay;
		limit_req_status 429;
		proxy_pass http://127.0.0.1:8080;
		include /etc/nginx/proxy-prophone.conf;
	}

	location = /api/auth/confirm {
		limit_req zone=auth_codes burst=4 nodelay;
		limit_req_status 429;
		proxy_pass http://127.0.0.1:8080;
		include /etc/nginx/proxy-prophone.conf;
	}

	location ~ ^/api/messengers/ {
		limit_req zone=api_heavy burst=3 nodelay;
		limit_req_status 429;
		proxy_pass http://127.0.0.1:8080;
		include /etc/nginx/proxy-prophone.conf;
	}

	location ~ ^/api/orders$ {
		limit_req zone=api_heavy burst=3 nodelay;
		limit_req_status 429;
		proxy_pass http://127.0.0.1:8080;
		include /etc/nginx/proxy-prophone.conf;
	}

	location /api/ {
		limit_req zone=api_general burst=20 nodelay;
		limit_req_status 429;
		proxy_pass http://127.0.0.1:8080;
		include /etc/nginx/proxy-prophone.conf;
	}

	# Человеческий ответ 429 в формате ProblemDetails — фронт покажет текст тостом.
	error_page 429 = @ratelimited;
	location @ratelimited {
		default_type application/problem+json;
		add_header Cache-Control "no-store" always;
		return 429 '{"title":"Слишком много запросов","status":429,"detail":"Подождите минуту и попробуйте снова"}';
	}

	# ── Статика и здоровье ─────────────────────────────────────────────────
	location = /health {
		proxy_pass http://127.0.0.1:8080/health;
		include /etc/nginx/proxy-prophone.conf;
	}

	location ~* \.(woff2|jpg|jpeg|png|svg|ico)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# ── Общие заголовки и сжатие ───────────────────────────────────────────
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	gzip on;
	gzip_types text/plain text/css application/json application/javascript image/svg+xml;
	gzip_min_length 1024;
}
