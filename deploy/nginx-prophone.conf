# ── pro телефон: справочный конфиг nginx для стенда (спринт 3, карточка 8) ──
# Раздаёт собранный фронтенд (client/build) и проксирует /api на API.
# Это НЕ docker-контейнер: фронтенд по решению команды не контейнеризуется.
# Копировать на VM в /etc/nginx/sites-available/prophone и включить в sites-enabled.
#
# Перед копированием: npm run build (в client/) — VITE_API_URL=/api зашивается
# в сборку, так что после смены окружения фронт пересобирается.

server {
	listen 80 default_server;
	server_name _;

	# Корень — собранная статика SvelteKit (adapter-static).
	root /var/www/prophone/client/build;
	index index.html;

	# SPA-фолбэк: все маршруты интерфейса ведут на index.html.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# /api — на API контейнера (docker-compose, порт 8080) с сохранением префикса.
	location /api/ {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	# /health — для проверок стенда (карточка 18).
	location = /health {
		proxy_pass http://127.0.0.1:8080/health;
	}

	# Статика: кэш шрифтов и картинок, HTML — без кэша.
	location ~* \.(woff2|jpg|png|svg|ico)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
	}
}
