# ── Общие настройки прокси для /api (подключается include-ом) ──
proxy_http_version 1.1;
proxy_set_header Host $host;
# Реальный IP клиента — беку для логов/аудита (чтобы заработали и его
# лимиты «на клиента», Владу нужно включить ForwardedHeaders в Program.cs).
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# Таймауты: VK-операции могут быть медленными.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_buffering on;
