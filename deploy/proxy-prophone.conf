# ── Общие настройки прокси для /api (подключается include-ом) ──
proxy_http_version 1.1;
proxy_set_header Host $host;
# Реальный IP клиента: жёстко ЗАМЕНЯЕМ X-Forwarded-For (как в эталоне
# README бека) — клиентский XFF не подделать. ForwardedHeaders на беке
# принимают заголовок только от доверенного прокси (см. KnownProxies).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# Таймауты: VK-операции могут быть медленными.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_buffering on;
